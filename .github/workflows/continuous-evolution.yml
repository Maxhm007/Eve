name: Eve Continuous Evolution — Peer Turn
on:
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-evolution.yml'
      - 'continuous_evolution.py'
  pull_request:
    paths:
      - '.github/workflows/continuous-evolution.yml'
      - 'continuous_evolution.py'
      - 'tests/test_continuous_evolution.py'
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: eve-continuous-evolution
  cancel-in-progress: false
jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Eve turn handling
        run: python -m unittest discover -s tests -p test_continuous_evolution.py -v
      - name: Run Eve bounded checks and write local acknowledgement
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python continuous_evolution.py
